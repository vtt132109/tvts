name: Deploy static content to Pages

# ⚠️ QUAN TRỌNG — ĐỌC FILE NÀY TRƯỚC KHI SỬA
#
# Mục đích: chỉ publish index.html, admin.html, css/, js/ — KHÔNG publish
# data/, tests/, tasks/, scripts/ (chứa PII và chi tiết kiểm thử nội bộ).
# Trước đây dùng `path: '.'` khiến TOÀN BỘ repo bị publish công khai.
#
# ─────────────────────────────────────────────────────────────────────
# ⚠️⚠️ CẦN LÀM MỘT LẦN TRONG GIAO DIỆN GITHUB (workflow này không tự làm được)
# ─────────────────────────────────────────────────────────────────────
# Settings > Pages > Build and deployment > Source:
#     ĐỔI TỪ  "Deploy from a branch"  SANG  "GitHub Actions"
#
# Vì sao? Nếu Source là "Deploy from a branch", GitHub chạy THÊM workflow
# "pages build and deployment" song song với workflow này, và workflow đó
# phục vụ TOÀN BỘ repo bằng Jekyll. Hai bản deploy sẽ tranh nhau ghi đè
# lẫn nhau, nên lúc nào cũng có lúc data/ và tests/ xuất hiện công khai.
# Đã xác minh hiện tượng này: probe liên tiếp cho thấy /data/admin_accounts.json
# trả 200 rồi 404 rồi 200 — đúng dấu hiệu hai nguồn phục vụ luân phiên.
#
# Sau khi đổi, chỉ còn workflow này chạy và bản phục vụ luôn sạch.
# ─────────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cho phép deploy chồng lên nhau nhưng huỷ bản đang chờ (tiết kiệm runner)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Chuẩn bị thư mục publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/js _site/css

          # Trang + tài nguyên tĩnh
          cp index.html admin.html _site/
          cp css/style.css _site/css/

          # Chỉ những file JS thực sự được nạp bởi trang.
          # roster thay cho sample30: danh sách 58 CTV nạp từ CSV, không nhúng
          # danh sách mẫu trong mã nguồn.
          # common/audit/store: tiện ích dùng chung (#16), nhật ký thao tác
          # (#10), lớp lưu trữ IndexedDB (#16) — thiếu 1 file là trang chết
          # ngay từ dòng script đầu, nên bước kiểm tra bên dưới sẽ chặn deploy.
          for f in cloud_sync month_calendar scheduler roster a11y_modal common audit store; do
            cp "js/$f.js" _site/js/
          done
          cp js/admin.js   _site/js/
          cp js/student.js _site/js/

          # Chốt danh sách file đã publish: mọi <script src="js/..."> trong
          # index.html và admin.html phải tồn tại, nếu không trang sẽ hỏng âm
          # thầm và deploy vẫn báo thành công.
          for html in index.html admin.html; do
            grep -o 'src="js/[a-z0-9_]*\.js' "_site/$html" | sed 's/src="//' | while read -r f; do
              if [ ! -f "_site/$f" ]; then
                echo "::error::$html tham chieu $f nhung file khong co trong _site"
                exit 1
              fi
            done
          done

          # .nojekyll: tắt Jekyll để các file/thư mục bị bỏ qua (vd .antigravity)
          # không bị GitHub Pages lọc bằng cách khác nhau giữa local và Pages
          touch _site/.nojekyll

          echo "--- Nội dung sẽ deploy ---"
          find _site -type f | sort
          echo "--- Tổng dung lượng ---"
          du -sh _site

      - name: Kiểm tra không rò rỉ dữ liệu nhạy cảm
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # Không được có file chứa PII / tài khoản / tài liệu nội bộ
          for bad in csv xlsx xls tsv; do
            if find _site -name "*.$bad" | grep -q .; then
              echo "::error::Phát hiện file .$bad trong thư mục deploy (chứa PII)"
              fail=1
            fi
          done
          # File sao lưu chứa dữ liệu toàn bộ danh sách + mật khẩu
          if find _site \( -name '*sao-luu*' -o -name 'backup-*' -o -name '*accounts*' \) | grep -q .; then
            echo "::error::Phát hiện file sao lưu / tài khoản trong thư mục deploy"
            fail=1
          fi
          for dir in tests tasks scripts .antigravity data .git .github _site; do
            if [ -e "_site/$dir" ]; then
              echo "::error::Thư mục nội bộ '$dir' bị deploy công khai"
              fail=1
            fi
          done
          # Không được hardcode THÔNG TIN ĐĂNG NHẬP trong JS được publish.
          # LƯU Ý: js/sample30.js cố tình chứa danh sách 30 CTV thật
          # (họ tên + MSSV) — đó là dữ liệu nghiệp vụ mà cổng Sinh Viên cần
          # để xác thực MSSV, KHÔNG phải rò rỉ. Chỉ kiểm tra thông tin
          # ĐĂNG NHẬP (mật khẩu / PIN / id tài khoản).
          if grep -rnE '"pin"[[:space:]]*:[[:space:]]*"[0-9]{4,6}"' _site/js/ ; then
            echo "::error::Phát hiện PIN tài khoản hardcode trong JS được publish"
            fail=1
          fi
          if grep -rnE 'usr_[0-9]{10,}' _site/ ; then
            echo "::error::Phát hiện id tài khoản dạng usr_<timestamp> trong bản deploy"
            fail=1
          fi
          exit $fail

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4