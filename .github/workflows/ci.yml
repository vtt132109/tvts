name: CI • Test Harness

# Chạy bộ kiểm thử hồi quy cho pull request (và chạy tay khi cần).
#
# Push lên main KHÔNG chạy ở đây nữa: static.yml đã chạy đúng các bước này
# (unit + clean_code + Playwright) và chặn deploy bằng `needs`, nên chạy thêm
# ở đây chỉ tốn gấp đôi thời gian runner.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Kiểm thử (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Chạy bộ kiểm thử hồi quy
        run: node tests/run_all_tests.js

      - name: Kiểm tra chất lượng mã nguồn
        run: node scripts/clean_code.js

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Chạy browser smoke tests
        run: npm run test:e2e
